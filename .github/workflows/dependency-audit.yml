name: Weekly dependency security audit

on:
  schedule:
    # Monday 08:17 Europe/Rome (offset avoids GitHub's busy top-of-hour window).
    - cron: '17 8 * * 1'
      timezone: Europe/Rome
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            directory: .
          - component: frontend
            directory: gsplay-frontend
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high --package-lock-only
